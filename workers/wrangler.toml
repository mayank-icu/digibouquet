name = "digibouquet-rooms"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Durable Objects ─────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "BOUQUET_ROOM"
class_name = "BouquetRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BouquetRoom"]

# ── Routes ──────────────────────────────────────────────────────────────────
# Replace YOUR_ZONE with your Cloudflare zone ID if using a custom domain.
# Remove this block entirely to use the default *.workers.dev subdomain.
# [[routes]]
# pattern = "rooms.yourdomain.com/*"
# zone_name = "yourdomain.com"

# ── Observability ────────────────────────────────────────────────────────────
[observability]
enabled = true
