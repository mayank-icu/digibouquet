<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>Digi Bouquet - Home</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico"/>
  <link rel="shortcut icon" href="./favicon.ico"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; height: 100%; }
    /* Map RN fontFamily strings to the loaded Google Font */
    [style*="Manrope-Regular"]  { font-family: 'Manrope', sans-serif !important; font-weight: 400 !important; }
    [style*="Manrope-SemiBold"] { font-family: 'Manrope', sans-serif !important; font-weight: 600 !important; }
    [style*="Manrope-Bold"]     { font-family: 'Manrope', sans-serif !important; font-weight: 700 !important; }
  </style>
</head>
<body style="margin:0;padding:0;background:#FAF7F2;">
  <div id="root"></div>
</body>
</html>
